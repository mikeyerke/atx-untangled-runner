name: Build and publish confidential runner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "supervisor-atx.conf"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

concurrency:
  group: confidential-runner-publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mikeyerke/atx-untangled-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=BUSL-1.1
          sbom: true
          provenance: mode=max

      - name: Fail on known critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.70.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL

      - name: Boot-test exact published image
        shell: bash
        run: |
          set -euo pipefail
          case_id="atx_00000000-0000-4000-8000-000000000001"
          destroy_after="$(date -u -d '+5 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          container_id="$(docker run --detach --rm \
            --env "ATX_CASE_ID=${case_id}" \
            --env "ATX_DESTROY_AFTER=${destroy_after}" \
            --env "ATX_MAX_RUNTIME_SECONDS=300" \
            --publish 127.0.0.1:8787:8787 \
            "${IMAGE}@${{ steps.build.outputs.digest }}")"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if body="$(curl --fail --silent --show-error http://127.0.0.1:8787/health)"; then
              test "$(jq -r .ok <<<"${body}")" = "true"
              test "$(jq -r .caseId <<<"${body}")" = "${case_id}"
              exit 0
            fi
            sleep 2
          done
          docker logs "${container_id}" || true
          exit 1

      - name: Publish immutable digest
        run: |
          echo "CONFIDENTIAL_RUNNER_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
