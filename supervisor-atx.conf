[program:atx-confidential-runner]
command=/usr/bin/node /opt/atx-runner/src/server.mjs
directory=/opt/atx-runner
user=user
environment=DISPLAY=":0",NODE_ENV="production"
autorestart=false
startretries=2
stdout_logfile=/dev/null
stderr_logfile=/dev/null
redirect_stderr=true
